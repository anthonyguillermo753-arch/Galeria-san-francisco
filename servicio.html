<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Servicio - Galería San Francisco Ica</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; padding: 1rem; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 30px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .foto-principal { width: 100%; max-height: 400px; object-fit: cover; background: #e2e8f0; }
        .contenido { padding: 2rem; }
        h1 { color: #1e3c72; margin-bottom: 1rem; font-size: 1.8rem; }
        .descripcion { font-size: 1rem; color: #334155; line-height: 1.6; margin-bottom: 1.5rem; }
        .whatsapp-buttons { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; }
        .whatsapp-btn { background: #25D366; color: white; text-decoration: none; padding: 0.7rem 1.3rem; border-radius: 50px; display: inline-flex; align-items: center; gap: 0.5rem; font-weight: bold; }
        .btn-compartir { background: #075e54; color: white; border: none; padding: 0.7rem 1.3rem; border-radius: 50px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; }
        .btn-volver { display: block; margin-top: 2rem; text-align: center; background: #2a5298; color: white; padding: 0.8rem; border-radius: 50px; text-decoration: none; font-weight: bold; transition: 0.2s; }
        .btn-volver:hover { background: #1e3c72; }
        .ejemplos-titulo { font-size: 1.3rem; color: #1e3c72; margin: 1.5rem 0 1rem; border-left: 4px solid #2a5298; padding-left: 1rem; }
        .ejemplos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .ejemplo-card { background: #f8fafc; border-radius: 16px; overflow: hidden; text-align: center; }
        .ejemplo-img { width: 100%; height: 160px; object-fit: cover; }
        .ejemplo-desc { padding: 0.5rem; font-size: 0.8rem; color: #475569; }
        .direccion { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid #e2e8f0; color: #2a5298; }
        .sin-ejemplos { background: #f1f5f9; padding: 1.5rem; text-align: center; border-radius: 20px; color: #64748b; margin: 1rem 0; }
        @media (max-width: 640px) { .contenido { padding: 1rem; } h1 { font-size: 1.3rem; } }
    </style>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyCP1rnP2TRWMZXfMjtB077gx3nUPW0oXMA",
            authDomain: "galeria-san-francisco.firebaseapp.com",
            projectId: "galeria-san-francisco",
            storageBucket: "galeria-san-francisco.firebasestorage.app",
            messagingSenderId: "970226110139",
            appId: "1:970226110139:web:aa2aef7628dce1e4fb639e"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);
        
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        
        async function cargarServicio() {
            const container = document.getElementById("contenido-container");
            
            if (!id) {
                container.innerHTML = "<div class='container'><div class='contenido'><h2>❌ Servicio no encontrado</h2><a href='index.html' class='btn-volver'>🏠 Volver al directorio</a></div></div>";
                return;
            }
            
            const docRef = doc(db, "servicios", id);
            const snap = await getDoc(docRef);
            
            if (!snap.exists()) {
                container.innerHTML = "<div class='container'><div class='contenido'><h2>❌ El servicio no existe</h2><a href='index.html' class='btn-volver'>🏠 Volver al directorio</a></div></div>";
                return;
            }
            
            const data = snap.data();
            document.title = `${data.servicio} - Galería San Francisco Ica`;
            
            let fotoURL = "";
            if (data.fotoURL) {
                try {
                    fotoURL = await getDownloadURL(ref(storage, data.fotoURL));
                } catch(e) { console.error("Error foto:", e); }
            }
            
            const fotoHTML = fotoURL 
                ? `<img src="${fotoURL}" alt="${data.servicio}" class="foto-principal">`
                : `<div class="foto-principal" style="height:250px; display:flex; align-items:center; justify-content:center; background:#e2e8f0;">📷 Sin imagen</div>`;
            
            const descripcion = data.descripcionCorta || "Sin descripción. Contáctame por WhatsApp.";
            const whatsapps = data.whatsapps || [];
            const whatsappHTML = whatsapps.length > 0 
                ? whatsapps.map(w => `<a href="https://wa.me/${w}" target="_blank" class="whatsapp-btn">📱 WhatsApp ${w}</a>`).join('')
                : `<p>⚠️ No hay WhatsApp configurado.</p>`;
            
            let ejemplosHTML = "";
            if (data.mostrar_ejemplos && data.ejemplos && data.ejemplos.length > 0) {
                ejemplosHTML = `
                    <div class="ejemplos-titulo">📸 Trabajos realizados</div>
                    <div class="ejemplos-grid">
                        ${data.ejemplos.map(ex => `
                            <div class="ejemplo-card">
                                <img src="${ex.url}" class="ejemplo-img" loading="lazy">
                                <div class="ejemplo-desc">${ex.descripcion || 'Ejemplo'}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                ejemplosHTML = `<div class="sin-ejemplos">📌 Este servicio aún no tiene ejemplos publicados.</div>`;
            }
            
            const html = `
                <div class="container">
                    ${fotoHTML}
                    <div class="contenido">
                        <h1>${escapeHTML(data.servicio)}</h1>
                        <div class="descripcion">${escapeHTML(descripcion)}</div>
                        
                        <div class="whatsapp-buttons">
                            ${whatsappHTML}
                        </div>
                        
                        <button id="btnCompartir" class="btn-compartir">
                            📢 Compartir este servicio
                        </button>
                        
                        ${ejemplosHTML}
                        
                        <div class="direccion">
                            📍 Av. San Martín 113 - Galería San Francisco, Ica
                        </div>
                        
                        <a href="index.html" class="btn-volver">
                            🏠 Volver al directorio principal
                        </a>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
            
            const btnCompartir = document.getElementById("btnCompartir");
            if (btnCompartir) {
                btnCompartir.onclick = () => {
                    const texto = `¡Mira este servicio en Galería San Francisco!

*${data.servicio}*
📝 ${descripcion.substring(0, 100)}...
📍 Av. San Martín 113, Ica
📱 WhatsApp: ${whatsapps[0] || "992484056"}

🔗 ${window.location.href}`;
                    
                    window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, "_blank");
                };
            }
        }
        
        function escapeHTML(str) {
            if (!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        cargarServicio();
    </script>
</head>
<body>
    <div id="contenido-container" style="max-width:1000px; margin:0 auto;"></div>
</body>
</html>
